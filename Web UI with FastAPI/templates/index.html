<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aivora Vision AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            color: #00d2ff;
        }

        header p {
            font-size: 1rem;
            color: #b3cdd1;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .video-card {
            flex: 2;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .video-card img {
            width: 100%;
            max-width: 640px;
            border-radius: 10px;
            border: 2px solid #00d2ff;
        }

        .form-card {
            flex: 1;
            min-width: 300px;
        }

        .form-card h2 {
            margin-bottom: 15px;
            color: #00d2ff;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #e0e0e0;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        #alert-box {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
            font-size: 0.9rem;
        }

        .success { background: rgba(40, 167, 69, 0.3); border: 1px solid #28a745; }
        .error { background: rgba(220, 53, 69, 0.3); border: 1px solid #dc3545; }
    </style>
</head>
<body>

    <header>
        <h1>🎭 Aivora Vision AI</h1>
        <p>Enterprise Masked Face Recognition & Biometric System</p>
    </header>

    <div class="container">
        <!-- Live Stream Video -->
        <div class="card video-card">
            <img src="/video_feed" alt="Live Stream Feed">
        </div>

        <!-- Registration Form -->
        <div class="card form-card">
            <h2>Register New Face</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="person_name">Person Name</label>
                    <input type="text" id="person_name" name="person_name" required placeholder="e.g., John Doe">
                </div>
                <div class="form-group">
                    <label for="file">Face Image</label>
                    <input type="file" id="file" name="file" accept="image/*" required>
                </div>
                <button type="submit" class="btn">Register Face</button>
            </form>
            <div id="alert-box"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const alertBox = document.getElementById('alert-box');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);

            alertBox.style.display = 'none';

            try {
                const response = await fetch('/upload_face', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                alertBox.style.display = 'block';
                alertBox.innerText = result.message;

                if (response.ok) {
                    alertBox.className = 'success';
                    form.reset();
                } else {
                    alertBox.className = 'error';
                }
            } catch (err) {
                alertBox.style.display = 'block';
                alertBox.className = 'error';
                alertBox.innerText = 'Network Error! Failed to connect to server.';
            }
        });
    </script>
</body>
</html>
